version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cyber-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyber_user
      POSTGRES_PASSWORD: cyber_password_secure
      POSTGRES_DB: cyber_moderation
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cyb-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyber_user -d cyber_moderation"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyber-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://cyber_user:cyber_password_secure@postgres:5432/cyber_moderation
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-cyber-production-secure-key-32-bytes!}
      - USE_REAL_MODEL=${USE_REAL_MODEL:-False}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cyb-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyber-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - cyb-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  cyb-network:
    driver: bridge
